<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">AIMAN.World 聚身之家</title>
  <desc id="desc">深色背景上的机器人产业关系图，连接机器人、企业、事件与证据。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d22"/>
      <stop offset="1" stop-color="#24212e"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#8f61ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8f61ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bb9dff"/>
      <stop offset="1" stop-color="#7447e9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#777182" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#background)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <circle cx="955" cy="172" r="245" fill="url(#halo)"/>
  <path d="M64 68h22" stroke="#a47dff" stroke-width="4" stroke-linecap="round"/>
  <text x="100" y="76" fill="#b99aff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700" letter-spacing="1">AIMAN.World</text>
  <text x="64" y="168" fill="#f7f5fb" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="66" font-weight="750">聚身之家</text>
  <text x="66" y="219" fill="#d2cfd9" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23">让机器人世界有出处，让 AI 也能问明白。</text>
  <rect x="65" y="258" width="193" height="37" rx="18.5" fill="#8655fa"/>
  <text x="88" y="283" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700">ROBOTICS WORLD ↗</text>
  <path d="M832 98 952 170 1090 86M952 170l132 99M952 170 819 265" fill="none" stroke="#a98cff" stroke-opacity=".48" stroke-width="2"/>
  <circle cx="952" cy="170" r="77" fill="#252430" stroke="url(#orbit)" stroke-width="2"/>
  <circle cx="952" cy="170" r="52" fill="none" stroke="#9a75ef" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="m952 132 33 19v38l-33 19-33-19v-38z" fill="none" stroke="#d5c7ff" stroke-width="2"/>
  <circle cx="952" cy="170" r="9" fill="#b491ff"/>
  <g fill="#292735" stroke="#a987ff" stroke-width="2">
    <circle cx="832" cy="98" r="35"/>
    <circle cx="1090" cy="86" r="35"/>
    <circle cx="1084" cy="269" r="35"/>
    <circle cx="819" cy="265" r="35"/>
  </g>
  <g fill="#f0eafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="832" y="105">R</text>
    <text x="1090" y="93">C</text>
    <text x="1084" y="276">E</text>
    <text x="819" y="272">S</text>
  </g>
  <g fill="#aaa4b5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" letter-spacing="1.5" text-anchor="middle">
    <text x="832" y="48">ROBOT</text>
    <text x="1090" y="36">COMPANY</text>
    <text x="1084" y="326">EVENT</text>
    <text x="819" y="322">SOURCE</text>
